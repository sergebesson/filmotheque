user_detail:
  description: Détail de l'utilisateur
  content:
    application/json:
      schema:
        $ref: "./schemas.yml#/user_detail"

user_infos:
  description: informations de l'utilisateur connecté
  content:
    application/json:
      schema:
        $ref: "./schemas.yml#/user_infos"

avatar:
  description: l'avatar de l'utilisateur `name`
  content:
    "image/*":
      schema:
        $ref: "./schemas.yml#/avatar"

user_list:
  description: liste des utilisateurs
  content:
    application/json:
      schema:
        $ref: "./schemas.yml#/user_list"

login_index_error:
  description: Accès refusé, reconstruction refusée ou durabilité non confirmée
  content:
    application/json:
      schema:
        type: object
        additionalProperties: false
        required: [ status, error_description ]
        properties:
          status:
            type: integer
            enum: [ 401, 500 ]
          error_description:
            type: string
